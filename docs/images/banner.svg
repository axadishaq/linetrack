<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">LineTrack</title>
  <desc id="d">LineTrack production-line tracker: units move through Print, Cure, Quality Check and Pack stations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#e2e8f0">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200"/>
    <path d="M150 0 V300 M300 0 V300 M450 0 V300 M600 0 V300 M750 0 V300 M900 0 V300 M1050 0 V300"/>
  </g>
  <text x="60" y="110" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">Line<tspan fill="url(#accent)">Track</tspan></text>
  <text x="62" y="150" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Production-line tracking with .NET, Vue, WPF and PostgreSQL</text>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
    <rect x="60" y="195" width="180" height="60" rx="12" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <text x="150" y="232" fill="#e0f2fe">Print</text>
    <line x1="245" y1="225" x2="295" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="195" width="180" height="60" rx="12" fill="#0b1220" stroke="#60a5fa" stroke-width="2"/>
    <text x="390" y="232" fill="#dbeafe">Cure</text>
    <line x1="485" y1="225" x2="535" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="540" y="195" width="180" height="60" rx="12" fill="#0b1220" stroke="#818cf8" stroke-width="2"/>
    <text x="630" y="232" fill="#e0e7ff">Quality Check</text>
    <line x1="725" y1="225" x2="775" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="780" y="195" width="180" height="60" rx="12" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
    <text x="870" y="232" fill="#ede9fe">Pack</text>
  </g>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <rect x="1000" y="60" width="150" height="195" rx="14" fill="#0b1220" stroke="#334155"/>
    <text x="1075" y="92" text-anchor="middle" font-size="14" fill="#94a3b8">Live floor</text>
    <circle cx="1025" cy="122" r="6" fill="#22c55e"/><text x="1040" y="127" font-size="14" fill="#e2e8f0">PRN-01</text>
    <circle cx="1025" cy="152" r="6" fill="#22c55e"/><text x="1040" y="157" font-size="14" fill="#e2e8f0">CUR-01</text>
    <circle cx="1025" cy="182" r="6" fill="#ef4444"/><text x="1040" y="187" font-size="14" fill="#e2e8f0">QC-01</text>
    <circle cx="1025" cy="212" r="6" fill="#eab308"/><text x="1040" y="217" font-size="14" fill="#e2e8f0">PCK-01</text>
    <text x="1075" y="243" text-anchor="middle" font-size="12" fill="#64748b">illustration</text>
  </g>
</svg>
