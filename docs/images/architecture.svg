<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="t d">
  <title id="t">LineTrack architecture</title>
  <desc id="d">Three clients (Vue dashboard, WPF operator station, machine simulator) talk to one ASP.NET Core API, which owns the business rules and is the only part that touches PostgreSQL.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="620" rx="18" fill="#f8fafc"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="500" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">LineTrack architecture</text>

    <!-- Clients -->
    <g>
      <rect x="40" y="70" width="270" height="100" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="175" y="105" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">Supervisor dashboard</text>
      <text x="175" y="130" text-anchor="middle" font-size="14" fill="#047857">Vue 3 · Vite · TypeScript</text>
      <text x="175" y="152" text-anchor="middle" font-size="13" fill="#047857">Pinia · ECharts · Tailwind</text>

      <rect x="365" y="70" width="270" height="100" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="500" y="105" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Operator station</text>
      <text x="500" y="130" text-anchor="middle" font-size="14" fill="#1d4ed8">WPF · .NET 10 · MVVM</text>
      <text x="500" y="152" text-anchor="middle" font-size="13" fill="#1d4ed8">Scan · pass/fail · report stop</text>

      <rect x="690" y="70" width="270" height="100" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <text x="825" y="105" text-anchor="middle" font-size="17" font-weight="700" fill="#7c2d12">Machine simulator</text>
      <text x="825" y="130" text-anchor="middle" font-size="14" fill="#c2410c">.NET Worker Service</text>
      <text x="825" y="152" text-anchor="middle" font-size="13" fill="#c2410c">Counts · temperature · faults</text>
    </g>

    <!-- Arrows -->
    <g stroke="#64748b" stroke-width="2" fill="none">
      <path d="M175 172 V250" marker-start="url(#a)" marker-end="url(#a)"/>
      <path d="M500 172 V250" marker-start="url(#a)" marker-end="url(#a)"/>
      <path d="M825 172 V250" marker-end="url(#a)"/>
    </g>
    <g font-size="12.5" fill="#475569">
      <text x="185" y="208">REST + SignalR</text>
      <text x="510" y="208">REST + SignalR</text>
      <text x="835" y="208">REST (API key)</text>
    </g>

    <!-- API -->
    <rect x="40" y="255" width="920" height="225" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="500" y="287" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">ASP.NET Core Web API (.NET 10)</text>
    <text x="500" y="310" text-anchor="middle" font-size="13" fill="#6d28d9">Controllers · JWT roles · FluentValidation · Problem Details · Serilog · /health</text>

    <rect x="70" y="330" width="260" height="125" rx="12" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="200" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">SignalR hub</text>
    <text x="200" y="382" text-anchor="middle" font-size="13" fill="#5b21b6">/hubs/production</text>
    <text x="200" y="404" text-anchor="middle" font-size="12.5" fill="#6b7280">ScanRecorded · MetricsUpdated</text>
    <text x="200" y="424" text-anchor="middle" font-size="12.5" fill="#6b7280">groups per station</text>

    <rect x="370" y="330" width="260" height="125" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="500" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Core services</text>
    <text x="500" y="382" text-anchor="middle" font-size="13" fill="#5b21b6">ScanService · MetricsService</text>
    <text x="500" y="404" text-anchor="middle" font-size="12.5" fill="#6b7280">station order · completion</text>
    <text x="500" y="424" text-anchor="middle" font-size="12.5" fill="#6b7280">no DB or web dependencies</text>

    <rect x="670" y="330" width="260" height="125" rx="12" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="800" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Background services</text>
    <text x="800" y="382" text-anchor="middle" font-size="13" fill="#5b21b6">metric rollups every 10 s</text>
    <text x="800" y="404" text-anchor="middle" font-size="12.5" fill="#6b7280">machine status updates</text>
    <text x="800" y="424" text-anchor="middle" font-size="12.5" fill="#6b7280">EF Core 10 · Npgsql</text>

    <path d="M500 482 V530" stroke="#64748b" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="512" y="512" font-size="12.5" fill="#475569">EF Core + hand-written SQL</text>

    <!-- DB -->
    <g>
      <path d="M350 545 V585 A150 14 0 0 0 650 585 V545" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <ellipse cx="500" cy="545" rx="150" ry="14" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
      <text x="500" y="580" text-anchor="middle" font-size="16" font-weight="700" fill="#075985">PostgreSQL 17</text>
    </g>
  </g>
</svg>
